name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          staging="rmai-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/rmai" "$staging/"
          cp README.md README.zh-CN.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          else
            sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmai-${{ matrix.target }}
          path: |
            rmai-${{ matrix.target }}.tar.gz
            rmai-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: rmai ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        run: |
          chmod +x scripts/update-formula.sh
          ./scripts/update-formula.sh "${{ steps.ver.outputs.version }}" dist

      - name: Commit and push Formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rmai.rb packaging/homebrew/rmai.rb
          if git diff --staged --quiet; then
            echo "No formula changes"
            exit 0
          fi
          git commit -m "chore: update Homebrew formula for ${{ steps.ver.outputs.tag }}"
          BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
