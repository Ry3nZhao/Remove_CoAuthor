[package]
name = "rmai"
version = "0.1.1"
edition = "2021"
description = "Remove AI co-author trailers and related markers from Git history"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ry3nZhao/Remove_CoAuthor"
homepage = "https://github.com/Ry3nZhao/Remove_CoAuthor"
keywords = ["git", "ai", "co-author", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rmai"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
